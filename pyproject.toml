[project]
name = "vikunja-tasks-sync"
version = "0.1.0"
description = "Sync Vikunja tasks with Google Calendar"
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "ics>=0.7.3",
    "pydantic>=2.14.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.4",
    "pytz>=2026.5",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "google-api-python-client-stubs>=1.40.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-python-dateutil>=2.9.0.20260807",
    "types-requests>=2.33.0.20261006",
]

[tool.mypy]
python_version = "3.14"
# Recursive glob; hidden dirs (.venv, .mypy_cache) are not matched
files = ["**/*.py"]
# Map tests/fakes.py to "tests.fakes" (tests/ has no __init__.py)
explicit_package_bases = true
strict = true
warn_unreachable = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true
local_partial_types = true
strict_bytes = true
extra_checks = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
    "unused-ignore",
]
mypy_path = "typings"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
